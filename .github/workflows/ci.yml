name: Offline Windows source and candidate checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: desktop-ui/web/package-lock.json
      - name: Pin npm and create locked build environment
        run: |
          npm install --global npm@11.13.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements-build.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source privacy and all Python tests (no hardware)
        run: |
          ./.venv/Scripts/python.exe build/check_release.py --source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m unittest discover -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m unittest discover -s desktop-ui -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All frontend tests
        working-directory: desktop-ui/web
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: TypeScript, Vite and clean onedir validation
        run: ./build/build_portable.ps1
      - name: Stage local candidate with locks, SBOM, licenses and hashes
        run: ./.venv/Scripts/python.exe build/stage_beta.py --destination dist/ci-candidate
      - name: Isolated schema validator (outside the build environment)
        run: |
          python -m venv output/audit-venv
          ./output/audit-venv/Scripts/python.exe -m pip install jsonschema==4.26.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/fetch_schemas.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify candidate manifest, license hashes, SBOM schema and binary mapping
        run: ./output/audit-venv/Scripts/python.exe build/check_release.py --bundle dist/ci-candidate --schema-directory output/mit-sbom-schema
      # No EXE/GUI/desktop acceptance on hosted runners. Those remain local gates.
      # No artifacts, Release, publishing action, secrets or hardware access.
